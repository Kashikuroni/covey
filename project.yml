# XcodeGen spec for the Covey.app bundle (icon + signing).
# Regenerate the project with: xcodegen generate
# Covey.xcodeproj and App/Info.plist are generated artifacts — not in git.
# SPM (Package.swift) remains the source of truth for tests and `swift run`;
# the app target compiles the same Sources/covey files.
name: Covey
options:
  bundleIdPrefix: dev.kashikuroni
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  covey:
    path: .
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.13.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  coveyd:
    type: tool
    platform: macOS
    sources:
      - path: Sources/coveyd
    dependencies:
      - package: covey
        product: CoveydCore

  Covey:
    type: application
    platform: macOS
    sources:
      - path: Sources/covey
      - path: App/Assets.xcassets
    dependencies:
      - package: covey
        product: CoveyKit
      - package: SwiftTerm
        product: SwiftTerm
      - target: coveyd
        link: false
        embed: false
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Covey
        CFBundleDisplayName: Covey
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kashikuroni.covey
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      # App.swift resolves the daemon next to the app binary, so coveyd
      # must land in Contents/MacOS. Nested binaries have to carry their
      # own signature before the outer bundle gets signed.
      - name: Embed coveyd
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/coveyd
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/coveyd
        script: |
          set -e
          cp "$BUILT_PRODUCTS_DIR/coveyd" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/coveyd"
          codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" \
            "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/coveyd"
